<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="maroonGlow" cx="30%" cy="25%" r="85%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#801C2B" />
      <stop offset="50%" stop-color="#58111D" />
      <stop offset="100%" stop-color="#380810" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#F2D8D8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6B1724" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Deep chic maroon base with subtle rounded luxury squircle -->
  <rect width="64" height="64" rx="16" fill="url(#maroonGlow)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#goldBorder)" stroke-width="1.5" />

  <!-- Elegant editorial serif monogram "H" with refined classical proportions -->
  <g fill="#FAF6F0">
    <!-- Left Stem & bracketed serifs -->
    <path d="M 18 17 L 26 17 L 26 19 L 23.5 19 L 23.5 45 L 26 45 L 26 47 L 18 47 L 18 45 L 20.5 45 L 20.5 19 L 18 19 Z" />
    <!-- Right Stem & bracketed serifs -->
    <path d="M 38 17 L 46 17 L 46 19 L 43.5 19 L 43.5 45 L 46 45 L 46 47 L 38 47 L 38 45 L 40.5 45 L 40.5 19 L 38 19 Z" />
    <!-- Editorial Crossbar -->
    <rect x="22" y="30.5" width="20" height="3" />
    <!-- Chic micro gem accent -->
    <circle cx="48" cy="18" r="2.2" fill="#E8B4B8" />
  </g>
</svg>
